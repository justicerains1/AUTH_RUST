name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check-and-build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.22.1
          cache: npm
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067
        with:
          toolchain: 1.98.0
          components: rustfmt, clippy
      - run: npm ci
      - run: npm run verify:docs
      - run: npm run test:tooling
      - run: npm run check
      - run: npm run test:unit
      - run: npm run build

  integration-t01:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.22.1
          cache: npm
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067
        with:
          toolchain: 1.98.0
          components: rustfmt, clippy
      - run: npm ci
      - run: npm run dev:secrets
      - run: npm run dev:up
      - run: npm run test:integration -- --task=T01
      - run: npm run test:integration -- --task=T03
      - run: npm run test:security -- --task=T04
      - run: npm run test:integration -- --task=T05
      - run: node node_modules/playwright/cli.js install --with-deps chromium
      - run: npm run test:e2e -- --task=T05
      - if: always()
        run: npm run dev:down
