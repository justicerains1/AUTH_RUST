name: CI

on:
  push:
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
  pull_request:
    paths-ignore:
      - 'docs/**'
      - '**/*.md'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check-and-build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.22.1
          cache: npm
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067
        with:
          toolchain: 1.98.0
          components: rustfmt, clippy
      - name: Restore Rust compiled artifacts
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: rust-${{ runner.os }}-1.98-${{ hashFiles('Cargo.lock') }}-${{ github.sha }}
          restore-keys: |
            rust-${{ runner.os }}-1.98-${{ hashFiles('Cargo.lock') }}-
      - name: Configure Windows OpenSSL
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./infra/windows/setup-openssl.ps1
      - run: npm ci
      - run: npm run verify:docs
      - run: npm run test:tooling
      - run: node scripts/ci-command.mjs check
      - run: node scripts/ci-command.mjs test:unit
      - run: node scripts/ci-command.mjs build

  integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        group: [authentication, protocol, product]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.22.1
          cache: npm
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067
        with:
          toolchain: 1.98.0
          components: rustfmt, clippy
      - name: Restore Rust integration artifacts
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: integration-${{ matrix.group }}-1.98-${{ hashFiles('Cargo.lock') }}-${{ github.sha }}
          restore-keys: |
            integration-${{ matrix.group }}-1.98-${{ hashFiles('Cargo.lock') }}-
      - run: npm ci
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Build cached development runtime
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: infra/Dockerfile.dev
          load: true
          tags: |
            auth-rust-api:development
            auth-rust-worker:development
            auth-rust-demo-a-bff:development
            auth-rust-demo-b-bff:development
          cache-from: type=gha,scope=dev-rust-${{ matrix.group }}
          cache-to: type=gha,scope=dev-rust-${{ matrix.group }},mode=max
      - name: Build cached development frontend
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: infra/Dockerfile.web.dev
          load: true
          tags: |
            auth-rust-identity-web:development
            auth-rust-demo-a:development
            auth-rust-demo-b:development
          cache-from: type=gha,scope=dev-web-${{ matrix.group }}
          cache-to: type=gha,scope=dev-web-${{ matrix.group }},mode=max
      - run: npm run dev:secrets
      - run: node scripts/ci-dev-up.mjs
        env:
          CI_PREBUILT_DEV_IMAGES: '1'
      - run: node node_modules/playwright/cli.js install --with-deps chromium firefox
      - name: Compile integration harnesses before startup timers
        run: node scripts/ci-integration-group.mjs ${{ matrix.group }} --prepare
      - name: Run isolated integration group
        run: node scripts/ci-integration-group.mjs ${{ matrix.group }}
      - if: always()
        run: npm run dev:down

  publish-production-artifacts:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [check-and-build, integration]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: write
      packages: write
    concurrency:
      group: release-${{ github.sha }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.22.1
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Authenticate production registry
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: printf '%s' "$GH_TOKEN" | docker login ghcr.io -u "${GITHUB_ACTOR}" --password-stdin
      - name: Select image repository
        env:
          SOURCE_REPOSITORY: ${{ github.repository }}
        run: echo "RELEASE_REPOSITORY_LOWER=${SOURCE_REPOSITORY,,}" >> "$GITHUB_ENV"
      - name: Publish cached Rust production image
        id: runtime-image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: infra/Dockerfile.prod
          platforms: linux/amd64
          push: true
          tags: ghcr.io/${{ env.RELEASE_REPOSITORY_LOWER }}/runtime:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha,scope=production-runtime
          cache-to: type=gha,scope=production-runtime,mode=max
      - name: Publish cached frontend production image
        id: edge-image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: infra/Dockerfile.edge.prod
          platforms: linux/amd64
          push: true
          tags: ghcr.io/${{ env.RELEASE_REPOSITORY_LOWER }}/edge:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha,scope=production-edge
          cache-to: type=gha,scope=production-edge,mode=max
      - name: Package deploy-only files and verified age tool
        env:
          RELEASE_REVISION: ${{ github.sha }}
          RELEASE_REPOSITORY: ${{ github.repository }}
          RELEASE_RUNTIME_IMAGE: ghcr.io/${{ env.RELEASE_REPOSITORY_LOWER }}/runtime@${{ steps.runtime-image.outputs.digest }}
          RELEASE_EDGE_IMAGE: ghcr.io/${{ env.RELEASE_REPOSITORY_LOWER }}/edge@${{ steps.edge-image.outputs.digest }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .local/security-tools
          curl --fail --location --retry 3 https://github.com/FiloSottile/age/releases/download/v1.3.2/age-v1.3.2-linux-amd64.tar.gz -o .local/security-tools/age.tar.gz
          printf '%s  %s\n' cbe24006683f8eb669266162894b9a522a1af52f2665fbc63a4bb032ed26ac10 .local/security-tools/age.tar.gz | sha256sum --check
          tar -xzf .local/security-tools/age.tar.gz -C .local/security-tools age/age
          node scripts/package-release.mjs "$PWD/.local/auth-rust-deploy-linux-amd64"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: production-deployment-${{ github.sha }}
          path: |
            .local/auth-rust-deploy-linux-amd64.tar.gz
            .local/auth-rust-deploy-linux-amd64.tar.gz.sha256
          retention-days: 30
          if-no-files-found: error
          include-hidden-files: true
      - name: Publish versioned deployment download
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN || github.token }}
          RELEASE_REVISION: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          release_tag="ci-$RELEASE_REVISION"
          gh release view "$release_tag" >/dev/null 2>&1 || gh release create "$release_tag" --target "$RELEASE_REVISION" --prerelease --title "Production artifacts $RELEASE_REVISION" --notes "CI-tested linux/amd64 images and deploy-only bundle. Publication is not production deployment or acceptance."
          gh release upload "$release_tag" install.sh .local/auth-rust-deploy-linux-amd64.tar.gz .local/auth-rust-deploy-linux-amd64.tar.gz.sha256 --clobber
