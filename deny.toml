[licenses]
confidence-threshold = 0.8
allow = [
    "MIT", "Apache-2.0", "BSD-2-Clause", "BSD-3-Clause", "ISC", "0BSD", "Zlib",
    "Unicode-3.0", "BSL-1.0", "Unlicense", "CC0-1.0", "MIT-0",
    "MPL-2.0", "CDLA-Permissive-2.0", "Apache-2.0 WITH LLVM-exception",
]

# First-party workspace packages are private; this does not skip third-party dependencies.
[licenses.private]
ignore = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
