[workspace]
members = [
  "crates/identity-core",
  "crates/identity-store",
  "crates/identity-server",
  "crates/identity-worker",
  "crates/identity-admin-cli",
  "crates/demo-bff",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
publish = false

[workspace.dependencies]
reqwest = { version = "=0.13.5", default-features = false, features = ["json"] }
aes-gcm = { version = "=0.11.1", features = ["zeroize"] }
argon2 = { version = "=0.6.0", features = ["zeroize"] }
axum = "=0.8.9"
base64 = "=0.23.1"
getrandom = "=0.4.3"
hmac = "=0.13.0"
ipnet = "=2.12.2"
jsonwebtoken = { version = "=11.1.0", default-features = false, features = ["aws_lc_rs", "use_pem"] }
lettre = { version = "=0.11.23", default-features = false, features = ["builder", "smtp-transport", "tokio1-rustls-tls", "pool", "hostname"] }
redis = { version = "=1.7.1", default-features = false, features = ["tokio-rustls-comp", "script"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
sha2 = "=0.11.0"
sqlx = { version = "=0.9.0", default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres", "uuid", "time", "json", "migrate", "macros"] }
subtle = "=2.6.1"
time = { version = "=0.3.55", features = ["serde", "formatting", "parsing", "macros"] }
tokio = { version = "=1.53.2", features = ["macros", "rt-multi-thread", "net", "signal", "time", "sync"] }
tracing = "=0.1.44"
tracing-subscriber = { version = "=0.3.23", features = ["json", "env-filter"] }
totp-rs = { version = "=6.0.0", default-features = false, features = ["otpauth", "zeroize"] }
url = "=2.5.8"
uuid = { version = "=1.27.0", features = ["v4", "serde"] }
webauthn-rs = { version = "=0.5.5", features = ["danger-allow-state-serialisation", "conditional-ui"] }
zeroize = "=1.9.1"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
