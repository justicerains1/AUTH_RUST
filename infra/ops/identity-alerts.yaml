groups:
  - name: identity-application
    rules:
      - alert: IdentityApiUnavailable
        expr: up{job="identity-api"} == 0
        for: 1m
        labels: { severity: critical }
        annotations: { summary: "身份API指标不可达" }
      - alert: IdentityWorkerUnavailable
        expr: up{job="identity-worker"} == 0
        for: 2m
        labels: { severity: critical }
        annotations: { summary: "身份Worker指标不可达" }
      - alert: IdentityServerErrorRate
        expr: rate(identity_http_server_errors_total[5m]) / clamp_min(rate(identity_http_requests_total[5m]), 0.01) > 0.01
        for: 5m
        labels: { severity: critical }
        annotations: { summary: "身份API错误率持续超过1%" }
      - alert: IdentityHttpP95Latency
        expr: histogram_quantile(0.95, sum by (le) (rate(identity_http_duration_seconds_bucket[5m]))) > 0.25
        for: 5m
        labels: { severity: warning }
        annotations: { summary: "身份API整体p95延迟持续超过250ms" }
      - alert: IdentityPasswordQueueSaturated
        expr: rate(identity_password_queue_timeouts_total[5m]) > 0
        for: 5m
        labels: { severity: warning }
        annotations: { summary: "密码哈希排队持续超时" }
      - alert: IdentityDatabasePoolSaturated
        expr: identity_database_pool_idle == 0 and identity_database_pool_size >= 32
        for: 2m
        labels: { severity: warning }
        annotations: { summary: "数据库连接池持续无空闲连接" }
      - alert: IdentityMailPermanentFailure
        expr: identity_outbox_permanent_failures > 0
        for: 1m
        labels: { severity: critical }
        annotations: { summary: "邮件存在永久失败队列" }
      - alert: IdentityMailQueueAge
        expr: identity_outbox_oldest_age_seconds > 900
        for: 5m
        labels: { severity: warning }
        annotations: { summary: "最老待投递邮件超过15分钟" }
      - alert: IdentityAuthenticationRateLimited
        expr: rate(identity_http_rate_limited_total[5m]) > 5
        for: 5m
        labels: { severity: warning }
        annotations: { summary: "认证限流持续高于正常预算" }
      - alert: IdentityWalArchiveDisabled
        expr: identity_postgres_wal_archive_enabled{job="identity-worker"} != 1
        for: 1m
        labels: { severity: critical }
        annotations: { summary: "PostgreSQL持续WAL归档未启用" }
      - alert: IdentityWalArchiverFailing
        expr: identity_postgres_wal_last_failed_timestamp_seconds{job="identity-worker"} > identity_postgres_wal_last_archived_timestamp_seconds{job="identity-worker"} and identity_postgres_wal_last_failed_timestamp_seconds{job="identity-worker"} > 0
        for: 1m
        labels: { severity: critical }
        annotations: { summary: "PostgreSQL最新WAL归档失败尚未被成功归档恢复" }
      - alert: IdentityWalArchiverMetricMissing
        expr: absent(identity_postgres_wal_archive_enabled{job="identity-worker"}) or absent(identity_postgres_wal_archived_total{job="identity-worker"}) or absent(identity_postgres_wal_archive_failures_total{job="identity-worker"}) or absent(identity_postgres_wal_last_archived_timestamp_seconds{job="identity-worker"}) or absent(identity_postgres_wal_last_failed_timestamp_seconds{job="identity-worker"})
        for: 1m
        labels: { severity: critical }
        annotations: { summary: "缺少必要PostgreSQL真实WAL归档状态指标" }
  - name: identity-host-operations
    rules:
      - alert: IdentityOpsExporterUnavailable
        expr: up{job="identity-ops"} == 0 or absent(up{job="identity-ops"})
        for: 1m
        labels: { severity: critical }
        annotations: { summary: "身份主机运维指标不可达或没有抓取目标" }
      - alert: IdentityOpsRequiredMetricMissing
        expr: absent(identity_ops_collection_success{job="identity-ops",check="disk_data"}) or absent(identity_ops_collection_success{job="identity-ops",check="disk_backup"}) or absent(identity_ops_collection_success{job="identity-ops",check="issuer_tls"}) or absent(identity_ops_collection_success{job="identity-ops",check="base_backup"}) or absent(identity_ops_collection_timestamp_seconds{job="identity-ops",check="disk_data"}) or absent(identity_ops_collection_timestamp_seconds{job="identity-ops",check="disk_backup"}) or absent(identity_ops_collection_timestamp_seconds{job="identity-ops",check="issuer_tls"}) or absent(identity_ops_collection_timestamp_seconds{job="identity-ops",check="base_backup"}) or absent(identity_ops_disk_size_bytes{job="identity-ops",volume="data"}) or absent(identity_ops_disk_size_bytes{job="identity-ops",volume="backup"}) or absent(identity_ops_disk_available_bytes{job="identity-ops",volume="data"}) or absent(identity_ops_disk_available_bytes{job="identity-ops",volume="backup"}) or absent(identity_ops_certificate_not_after_timestamp_seconds{job="identity-ops"}) or absent(identity_ops_base_backup_completed_timestamp_seconds{job="identity-ops"})
        for: 1m
        labels: { severity: critical }
        annotations: { summary: "身份主机缺少必要磁盘、证书或备份指标" }
      - alert: IdentityOpsCheckFailed
        expr: identity_ops_collection_success{job="identity-ops"} != 1
        for: 1m
        labels: { severity: critical }
        annotations: { summary: "身份主机受控运维检查失败" }
      - alert: IdentityOpsCollectionStale
        expr: time() - identity_ops_collection_timestamp_seconds{job="identity-ops"} > 300 or identity_ops_collection_timestamp_seconds{job="identity-ops"} > time() + 60 or identity_ops_collection_timestamp_seconds{job="identity-ops"} <= 0
        for: 1m
        labels: { severity: critical }
        annotations: { summary: "身份主机运维采集已超过5分钟或时间无效" }
      - alert: IdentityDiskSpaceLow
        expr: identity_ops_disk_available_bytes{job="identity-ops"} / identity_ops_disk_size_bytes{job="identity-ops"} < 0.10 or identity_ops_disk_available_bytes{job="identity-ops"} < 1073741824
        for: 5m
        labels: { severity: warning }
        annotations: { summary: "身份数据或备份磁盘可用空间低于10%或1GiB" }
      - alert: IdentityDiskSpaceCritical
        expr: identity_ops_disk_available_bytes{job="identity-ops"} / identity_ops_disk_size_bytes{job="identity-ops"} < 0.05 or identity_ops_disk_available_bytes{job="identity-ops"} < 536870912
        for: 1m
        labels: { severity: critical }
        annotations: { summary: "身份数据或备份磁盘可用空间低于5%或512MiB" }
      - alert: IdentityCertificateExpiresSoon
        expr: identity_ops_certificate_not_after_timestamp_seconds{job="identity-ops"} - time() < 1209600 and identity_ops_certificate_not_after_timestamp_seconds{job="identity-ops"} > 0
        for: 5m
        labels: { severity: warning }
        annotations: { summary: "身份issuer证书将在14天内到期" }
      - alert: IdentityCertificateExpiryCritical
        expr: identity_ops_certificate_not_after_timestamp_seconds{job="identity-ops"} - time() < 259200 and identity_ops_certificate_not_after_timestamp_seconds{job="identity-ops"} > 0
        for: 1m
        labels: { severity: critical }
        annotations: { summary: "身份issuer证书将在3天内到期或已经过期" }
      - alert: IdentityBaseBackupOverdue
        expr: time() - identity_ops_base_backup_completed_timestamp_seconds{job="identity-ops"} > 86400 or identity_ops_base_backup_completed_timestamp_seconds{job="identity-ops"} <= 0 or identity_ops_base_backup_completed_timestamp_seconds{job="identity-ops"} > time() + 60
        for: 5m
        labels: { severity: critical }
        annotations: { summary: "身份完整基础备份超过24小时或完成记录无效" }
      - alert: IdentityWalArchiveMetricMissing
        expr: absent(identity_ops_collection_success{job="identity-ops",check="wal_archive"}) or absent(identity_ops_collection_timestamp_seconds{job="identity-ops",check="wal_archive"}) or absent(identity_ops_wal_archive_completed_timestamp_seconds{job="identity-ops"}) or absent(identity_ops_wal_archive_duration_seconds{job="identity-ops"})
        for: 1m
        labels: { severity: critical }
        annotations: { summary: "缺少持久加密WAL归档回执指标" }
      - alert: IdentityWalArchiveObservationOld
        expr: time() - identity_ops_wal_archive_completed_timestamp_seconds{job="identity-ops"} > 900 and identity_ops_wal_archive_completed_timestamp_seconds{job="identity-ops"} > 0
        for: 5m
        labels: { severity: warning }
        annotations: { summary: "最近持久WAL归档超过15分钟，请核对是否空闲或存在归档积压，不能直接推定RPO违规" }
      - alert: IdentityWalArchiveTimestampInvalid
        expr: identity_ops_wal_archive_completed_timestamp_seconds{job="identity-ops"} <= 0 or identity_ops_wal_archive_completed_timestamp_seconds{job="identity-ops"} > time() + 60
        for: 1m
        labels: { severity: critical }
        annotations: { summary: "持久WAL归档完成时间缺失或超前" }
      - alert: IdentityWalArchiveSlowPublication
        expr: identity_ops_wal_archive_duration_seconds{job="identity-ops"} > 300
        for: 1m
        labels: { severity: warning }
        annotations: { summary: "单个WAL加密发布耗时超过5分钟，不等于完整归档积压或复制延迟" }
