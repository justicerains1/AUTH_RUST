          "email_verified": {
            "type": "boolean"
          }
        },
        "required": [
          "sub"
        ],
        "description": "profile才返回display_name（若有），email才返回email/email_verified；每次验证PG权威撤销状态。",
        "examples": [
          {
            "sub": "65d69320-97e8-4de0-a062-4c0f948a1b80",
            "email": "person@example.test",
            "email_verified": true
          }
        ]
      },
      "OAuthError": {
        "type": "object",
        "additionalProperties": false,
        "properties": {
          "error": {
            "type": "string",
            "enum": [
              "invalid_request",
              "invalid_client",
              "invalid_grant",
              "unauthorized_client",
              "unsupported_grant_type",
              "invalid_scope",
              "access_denied",
              "unsupported_response_type",
              "login_required",
              "consent_required",
              "interaction_required",
              "server_error",
              "temporarily_unavailable",
              "invalid_token",
              "insufficient_scope",
              "unsupported_token_type"
            ]
          },
          "error_description": {
            "type": "string",
            "minLength": 1,
            "maxLength": 256,
            "pattern": "^[\\x20-\\x7E]+$",
            "description": "安全ASCII协议说明，不含内部主机/SQL/secret。"
          },
          "error_uri": {
            "type": "string",
            "format": "uri",
            "maxLength": 2048
          }
        },
        "required": [
          "error"
        ],
        "examples": [
          {
            "error": "invalid_request",
            "error_description": "Invalid request."
          }
        ]
      },
      "AuthorizeError": {
        "type": "object",
        "additionalProperties": false,
        "properties": {
          "error": {
            "type": "string",
            "enum": [
              "invalid_request",
              "unauthorized_client",
              "access_denied",
              "unsupported_response_type",
              "invalid_scope",
              "login_required",
              "consent_required",
              "interaction_required",
              "server_error",
              "temporarily_unavailable"
            ]
          },
          "error_description": {
            "type": "string",
            "minLength": 1,
            "maxLength": 256,
            "pattern": "^[\\x20-\\x7E]+$"
          },
          "state": {
            "$ref": "#/components/schemas/OAuthState"
          }
        },
        "required": [
          "error",
          "state"
        ],
        "description": "仅redirect_uri验证通过才返回注册回调，携带原state；未通过在身份域安全页面展示，不回跳。",
        "examples": [
          {
            "error": "access_denied",
            "state": "EXAMPLE_STATE_0000000001"
          }
        ]
      },
      "RsaPublicJwk": {
        "type": "object",
        "additionalProperties": false,
        "properties": {
          "kty": {
            "const": "RSA"
          },
          "use": {
            "const": "sig"
          },
          "alg": {
            "const": "RS256"
          },
          "kid": {
            "type": "string",
            "minLength": 1,
            "maxLength": 128,
            "pattern": "^[A-Za-z0-9._-]+$"
          },
          "n": {
            "type": "string",
            "minLength": 342,
            "maxLength": 1366,
            "pattern": "^[A-Za-z0-9_-]+$"
          },
          "e": {
            "type": "string",
            "minLength": 1,
            "maxLength": 6,
            "pattern": "^[A-Za-z0-9_-]+$"
          }
        },
        "required": [
          "kty",
          "use",
          "alg",
          "kid",
          "n",
          "e"
        ],
        "description": "只有公共字段；不得出现d/p/q/dp/dq/qi/oth/k；kid唯一，旧公钥至少保留12h+2min。",
        "examples": [
          {
            "kty": "RSA",
            "use": "sig",
            "alg": "RS256",
            "kid": "current",
            "n": "",
            "e": "AQAB"
          }
        ]
      },
      "Jwks": {
        "type": "object",
        "additionalProperties": false,
        "properties": {
          "keys": {
            "type": "array",
            "items": {
              "$ref": "#/components/schemas/RsaPublicJwk"
            },
            "minItems": 1,
            "maxItems": 20
          }
        },
        "required": [
          "keys"
        ],
        "examples": [
          {
            "keys": [
              {
                "kty": "RSA",
                "use": "sig",
                "alg": "RS256",
                "kid": "current",
                "n": "",
                "e": "AQAB"
              }
            ]
          }
        ]
      },
