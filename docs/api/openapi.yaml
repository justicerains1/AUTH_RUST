    },
    {
      "name": "Account",
      "description": "本人账号与安全管理"
    },
    {
      "name": "Consent",
      "description": "浏览器授权事务与用户同意"
    },
    {
      "name": "Admin",
      "description": "近期强认证管理员管理"
    },
    {
      "name": "OIDC",
      "description": "标准OAuth2/OIDC机密客户端profile"
    }
