      "RpLogoutRequest": {
        "type": "object",
        "additionalProperties": false,
        "properties": {
          "id_token_hint": {
            "$ref": "#/components/schemas/IdToken"
          },
          "post_logout_redirect_uri": {
            "type": "string",
            "format": "uri",
            "maxLength": 2048
          },
          "state": {
            "$ref": "#/components/schemas/OAuthState"
          }
        },
        "required": [],
        "description": "有效hint需签名/iss/aud/sid与当前浏览器绑定；expired hint仅此退出用途可在匹配当前sid/client时使用；无效/无hint仅本地确认且不回跳。",
        "examples": [
          {
            "id_token_hint": "RVhBTVBMRQ.SU5WQUxJRA.U0lHTkFUVVJF",
            "post_logout_redirect_uri": "https://app-a.example/oidc/logout-callback",
            "state": "EXAMPLE_STATE_0000000001"
          }
        ]
      },
      "LogoutConfirmationRequest": {
        "type": "object",
        "additionalProperties": false,
        "properties": {
          "confirmation_id": {
            "$ref": "#/components/schemas/Uuid"
          },
          "decision": {
            "type": "string",
            "enum": [
              "logout",
              "cancel"
            ]
          }
        },
        "required": [
          "confirmation_id",
          "decision"
        ],
        "description": "由GET/POST退出入口建立短期浏览器绑定确认，不接受客户端指定sid/return_to。",
        "examples": [
          {
            "confirmation_id": "65d69320-97e8-4de0-a062-4c0f948a1b80",
            "decision": "logout"
          }
        ]
      },
