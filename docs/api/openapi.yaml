    "version": "1.0.0",
    "description": "T02设计契约：除T01健康服务外，以下认证/API/OIDC端点尚未实现或验收，不代表可用服务。所有JSON全路径/api/v1；标准协议保持root /oauth。"
  },
  "servers": [
    {
      "url": "/",
      "description": "相对于部署身份平台固定origin；不可从请求Host决定issuer。"
    }
  ],
