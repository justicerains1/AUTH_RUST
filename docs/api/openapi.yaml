    "parameters": {
      "Csrf": {
        "name": "X-CSRF-Token",
        "in": "header",
        "required": true,
        "description": "当前预认证或会话绑定CSRF，结合精确Origin验证。",
        "schema": {
          "$ref": "#/components/schemas/CsrfToken"
        }
      },
      "Origin": {
        "name": "Origin",
        "in": "header",
        "required": true,
        "description": "必须精确等于配置ISSUER origin，禁止Host推导/任意CORS。",
        "schema": {
          "type": "string",
          "format": "uri"
        }
      },
      "Cursor": {
        "name": "cursor",
        "in": "query",
        "required": false,
        "description": "不透明且绑定固定排序/过滤/用户上下文；无效或不同过滤重用返回400。",
        "schema": {
          "type": "string",
          "minLength": 1,
          "maxLength": 2048
        }
      },
      "Limit": {
        "name": "limit",
        "in": "query",
        "required": false,
        "schema": {
          "type": "integer",
          "minimum": 1,
          "maximum": 100,
          "default": 20
        }
      }
    },
    "headers": {
      "RequestId": {
        "description": "服务端生成 UUID；不接受客户端覆盖；错误body相同request_id。",
        "schema": {
          "$ref": "#/components/schemas/Uuid"
        }
      },
      "NoStore": {
        "description": "认证/账号/后台与协议动态响应禁缓存。",
        "schema": {
          "const": "no-store"
        }
      },
      "RetryAfter": {
        "description": "超额后允许重试的秒数。",
        "schema": {
          "type": "integer",
          "minimum": 1
        }
      },
      "SetCookie": {
        "description": "生产__Host-identity/__Host-identity-preauth；Secure HttpOnly Path=/ SameSite=Lax 无Domain。开发identity-dev/identity-preauth-dev只在localhost。所有值不可日志或存储。",
        "schema": {
          "type": "string"
        }
      },
      "Location": {
        "description": "服务端已验证的身份域内部页面或客户端精确回调。",
        "schema": {
          "type": "string",
          "format": "uri",
          "maxLength": 4096
        }
      },
      "WwwAuthenticate": {
        "description": "Basic realm 或标准 Bearer error挑战，不记录凭证。",
        "schema": {
          "type": "string"
        }
      }
    },
    "securitySchemes": {
      "identityCookie": {
        "type": "apiKey",
        "in": "cookie",
        "name": "__Host-identity",
        "description": "生产身份session随机Cookie，仅服务端持有状态；Secure HttpOnly Path=/ SameSite=Lax。"
      },
      "preauthCookie": {
        "type": "apiKey",
        "in": "cookie",
        "name": "__Host-identity-preauth",
        "description": "生产预认证CSRF与挑战绑定Cookie，绝非普通身份session。"
      },
      "clientBasic": {
        "type": "http",
        "scheme": "basic",
        "description": "仅机密BFF client_secret_basic；所有BFF强制PKCE S256；secret只服务端。"
      },
      "accessToken": {
        "type": "http",
        "scheme": "bearer",
        "bearerFormat": "Opaque",
        "description": "仅服务端BFF持有不透明Bearer access token，浏览器不持有OAuth token；不是JWT/ID Token。"
      }
    }
  }
