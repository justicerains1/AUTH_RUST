<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>登录账号 · 一方身份设计稿</title><link rel="stylesheet" href="design.css"></head><body><div class="design-tag">T15 视觉评审稿 · 2026-10-07 · 示例内容用于布局评审</div><header class="top"><div class="wrap"><a class="brand" href="home.html"><span class="brand-mark" aria-hidden="true">◈</span>一方身份</a><nav class="nav" aria-label="主导航"><a href="home.html">产品</a><a class="essential" href="account.html">账号安全</a><a class="btn essential" href="login.html">登录</a></nav></div></header><main class="wrap login-grid"><section class="login-intro"><div class="eyebrow">WELCOME BACK</div><h1>欢迎回来。<br>从这里，继续连接。</h1><p class="lead muted">登录一方身份，管理账号，或继续前往你已授权的应用。</p><aside class="security-note"><h3>你的账号，由你掌控</h3><p>登录后可查看活跃会话和授权应用，开启双重验证，为重要操作增加一道保护。</p></aside></section><section class="form-panel" aria-labelledby="login-title"><h2 id="login-title">登录账号</h2><p class="muted">请使用你的账号邮箱。</p><form><div class="field"><label for="email">邮箱地址</label><input id="email" type="email" autocomplete="username" placeholder="name@example.com"></div><div class="field"><div class="row-between"><label for="password">密码</label><a class="small-link" href="states.html">忘记密码？</a></div><input id="password" type="password" autocomplete="current-password" placeholder="输入密码"></div><button type="button" class="primary full">登录</button><div class="divider">或使用更便捷的方式</div><button type="button" class="full" style="margin-top:16px">使用通行密钥 <span aria-hidden="true">↗</span></button><p class="inline-note">还没有账号？ <a href="states.html">创建账号</a></p></form></section></main><div class="wrap"><footer class="footer"><span>一方身份 · 让每次访问，都有清晰的归属。</span><span><a href="states.html">组件与状态规范</a>　隐私与帮助</span></footer></div></body></html>
